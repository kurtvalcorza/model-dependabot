# Keeps the repository's own dependencies current (RFC #38 item 3).
#
# uv: the runtime pins in pyproject.toml and the resolved versions in uv.lock.
# github-actions: the workflows pin each action to a commit SHA; Dependabot moves the SHA when the
# action publishes a new release.
#
# Minor and patch updates are grouped into one weekly pull request per ecosystem so they do not
# crowd out review; a major version arrives on its own pull request.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
