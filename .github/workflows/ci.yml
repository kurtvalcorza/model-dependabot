# Offline test suite and lint on every push and pull request.
# The default pytest run blocks the network (tests/conftest.py); live tests are marked `live`
# and excluded by default, so CI never queries the sources.
name: ci

on:
  push:
    branches: [main, "[0-9][0-9][0-9]-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Tests (network blocked)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
