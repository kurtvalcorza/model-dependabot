# Offline test suite and lint on every push and pull request.
# The default pytest run blocks the network (tests/conftest.py); live tests are marked `live`
# and excluded by default, so CI never queries the sources.
name: ci

on:
  push:
    branches: [main, "[0-9][0-9][0-9]-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python >= 3.12; 3.13 is the newest release it must
        # keep working on (RFC #38 item 12).
        python-version: ["3.12", "3.13"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.3.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Tests (network blocked)
        run: uv run pytest -q
      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check
      - name: Format
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check
