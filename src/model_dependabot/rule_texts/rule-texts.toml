[MDB601]
limitations = "It says the parent's alert applies to an item the parent version you named holds, and that the edge types let it travel. It does not say that this model loads that item: the travel table is a rule of thumb per edge type, not a reading of your bytes."
closes = "It is not an alert and does not close: a check stops recording it once the parent alert no longer travels to this model (the parent's alert is dismissed, cleared, withdrawn or fixed by the version you name or an earlier one, the edge is removed or its type no longer lets the kind travel). The parent's owner acts on the parent's alert."
fix = "Read the parent's alert and decide with the parent's owner. To stop it here, register a version of this model that names another parent version or another parent, or no longer names that parent. Nothing on this model needs dismissing: the event never counts for `--fail-on`."
not_established = [
  "whether this alert affects model {model_id}",
  "whether model {model_id} loads the parent's item the alert names",
]
steps = [
  "Read the inherited event, its path and the parent alert it cites: `model-dependabot alerts {model_id}`.",
  "Read the parent's alert with its evidence, using the parent alert id the event names: `model-dependabot alert show {alert_id}`.",
  "If this model should no longer name that parent version, register a version that names another: `model-dependabot register MANIFEST.toml --model-id {model_id}`.",
]
